<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>JWebsite Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h2 class="logo">Logo</h2>
        <nav class="navigation">
            <button class="btnLogin-popup">Login</button>
        </nav>
    </header>

    <div class="wrapper">
        <span class="icon-close">
            <ion-icon name="close-outline"></ion-icon>
        </span>

        <!-- Login Form -->
        <div class="form-box login">
            <h2>Login</h2>
            <form id="login-form">
                <div class="input-box">
                    <span class="email"><ion-icon name="mail-outline"></ion-icon></span> 
                    <input type="email" id="login-email" name="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="password"><ion-icon name="lock-closed-outline"></ion-icon></span> 
                    <input type="password" id="login-password" name="password" required>
                    <label>Password</label>
                </div>
                <div class="remember-forget">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                    <button type="submit" class="btn">Login</button>
                <div class="login-register">
                    <p>Don't have an account? <a href="#" class="login-link">register</a></p>
                </div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box Register">
            <h2>Register</h2>
            <form id="Register-form">
                <div class="input-box">
                    <span class="icon"><ion-icon name="person-outline"></ion-icon></span> 
                    <input type="text" id="register-name" name="name" required />
                    <label>Name</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail-outline"></ion-icon></span> 
                    <input type="email" id="register-email" name="email" required />
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span> 
                    <input type="password" id="register-password" name="password" required />
                    <label>Password</label>
                </div>
                <div class="Agree">
                    <label><input type="checkbox"> I agree to terms and conditions</label>
                </div>
            
                    <button type="submit" class="btn">Register</button>
                
                <div class="login-register">
                    <p>Already have an account? <a href="#" class="register-link">Login</a></p>
                </div>
            </form>
        </div>

        <!-- Custom Alert -->
        <div id="custom-alert" class="custom-alert">
            <div class="alert-message">
                <span id="alert-text"></span>
                <button id="close-alert" class="close-alert">×</button>
            </div>
        </div>
    </div>

    <!-- Ionicons Library -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="script.js"></script>

    <script>
        
        function showCustomAlert(message, type = "error") {
            const alertText = document.getElementById("alert-text"); // Get the message area
            alertText.textContent = message; // Set the message content
            const customAlert = document.getElementById("custom-alert"); // Get the custom alert container
            customAlert.className = `custom-alert ${type} show`; // Show the alert with type
            customAlert.style.display = "block"; // Ensure the alert is visible
            setTimeout(() => {
                customAlert.classList.remove("show"); // Hide the alert after 3 seconds
                customAlert.style.display = "none"; // Hide the alert
            }, 3000);
        }

        // Close alert when close button is clicked
        closeAlertButton.addEventListener('click', () => {
            const customAlert = document.getElementById("custom-alert");
            customAlert.classList.remove("show");
            customAlert.style.display = "none";
        });
    </script>
</body>
</html>
