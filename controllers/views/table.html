<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Table Example</title>
    <link rel="stylesheet" href="/table.css">
</head>
<body>
    <header class="appbar">
        <span class="menu"><ion-icon name="menu-outline"></ion-icon></span>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search...">
            <button class="search-button"><ion-icon name="search-outline"></ion-icon>
            </button>
        </div>
    </header>

    <div class="nav-wrapper">
        <nav class="sidebar">
            <a class="home" href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Products</a>
            <a href="#">Portfolio</a>
            <a href="#">Blog</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
            <a href="#">Support</a>
            <a href="#">Services</a>
            <a href="#">Products</a>
            <a href="#">Portfolio</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
            <a href="#">Support</a>
            <a href="#">Settings</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="form-container">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="email" placeholder="Email">
            <button class="btn add-btn" onclick="addRow()">Add</button>
        </div>
        
        <table id="tabledata" class="tabledata">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th class="actions">Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows will be added here dynamically -->
            </tbody>
        </table>
        <p class="no_results" id="no-results" style="display: none; color: red;">User not found</p>
    </div>

    <!-- Custom Alert -->
    <div id="custom-alert" class="custom-alert">
        <div class="alert-message">
            <span id="alert-text"></span>
            <button id="close-alert" class="close-alert">×</button>
        </div>
    </div>

    
    <script src="table.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
